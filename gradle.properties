# Memory for the Gradle daemon (Android builds need more than plain Java modules) and UTF-8
# for the daemon and the programs it starts, whatever the Windows code page is.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Build the modules (core, desktop, android) in parallel when they do not depend on each other.
org.gradle.parallel=true

# Reuse task outputs from earlier builds (even after a clean) instead of running the tasks again.
org.gradle.caching=true

# Skip the configuration phase when the build scripts have not changed since the last build.
org.gradle.configuration-cache=true

# Android: use the AndroidX libraries (required by Android Studio's module templates).
android.useAndroidX=true
